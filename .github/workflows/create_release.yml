name: Create a release

on:
  workflow_dispatch:
    inputs:
      type:
        description: Release type
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

run-name: Create a release - ${{ github.event.inputs.type }}

concurrency:
  group: create-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag-release:
    name: Bump version and tag release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Create release app token
        uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Bump version and tag release
        id: version
        run: |
          version=$(bun pm version "$RELEASE_TYPE" --no-git-tag-version)
          tag=${version#v}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Release $tag"
          git tag -a "$tag" -m "Release $tag"
          git push --atomic origin HEAD:main "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TYPE: ${{ inputs.type }}

  create-release:
    name: Create a release
    needs: tag-release
    runs-on: ubuntu-latest

    steps:
      - name: Create release app token
        uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create a release
        run: gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.tag-release.outputs.tag }}
